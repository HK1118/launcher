[package]
name = "launcher"
version = "0.1.0"
edition = "2024"

[dependencies]
egui = "0.36"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow"]}
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.17"
notify = "8.2"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
